<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silver Collection</title>
<style>
  :root {
    --bg: #1b1b1c;
    --text: #afaeae;
    --muted: #a8a8a8;
    --rule: #6e6e6e;
    --nav-bg: #ffffff;
    --nav-text: #1b1b1c;
    --nav-h: 72px;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;            /* the wheel takes the scroll, not the page */
    background: #ffff;
    color: var(--bg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Nav ---------- */
  .nav {
    position: fixed;
    inset: 0 0 auto 0;
    height: var(--nav-h);
    background: var(--nav-bg);
    color: var(--nav-text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(20px, 4vw, 56px);
    z-index: 20;
  }
  .nav__logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: inherit;
    text-decoration: none;
  }
  .nav__links { display: flex; gap: clamp(16px, 3vw, 40px); list-style: none; }
  .nav__links a {
    color: inherit;
    text-decoration: none;
    font-size: 15px;
    padding: 6px 0;
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
  }
  .nav__links a:hover, .nav__links a:focus-visible { border-bottom-color: currentColor; outline: none; }
  .nav__links button {
    font: inherit;
    font-size: 15px;
    color: inherit;
    background: none;
    border: 0;
    border-bottom: 1px solid transparent;
    padding: 6px 0;
    cursor: pointer;
    transition: border-color .2s;
  }
  .nav__links button:hover, .nav__links button:focus-visible { border-bottom-color: currentColor; outline: none; }
  .nav__links button[aria-pressed="true"] { border-bottom-color: currentColor; font-weight: 600; }

  /* ---------- Stage ---------- */
  .stage {
    position: fixed;
    inset: var(--nav-h) 0 0 0;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }
  .stage.is-dragging { cursor: grabbing; }

  .segment {
    position: absolute;
    overflow: hidden;
    background: linear-gradient(135deg, #d9d9d9, #b5b5b5);
    will-change: transform;
    cursor: pointer;
  }
  .segment img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .segment__placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6a6a6a;
    font-size: 14px;
    pointer-events: none;
  }

  /* ---------- Info panel ---------- */
  .panel {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }
  .panel__inner {
    transition: opacity .35s ease, transform .35s ease;
  }
  .panel.is-changing .panel__inner {
    opacity: 0;
    transform: translateY(10px);
  }
  .rule {
    width: min(220px, 70%);
    height: 2px;
    margin: 0 auto;
    background: var(--rule);
  }
  .panel__year {
    font-size: clamp(44px, 5.2vw, 76px);
    font-weight: 300;
    letter-spacing: 0.12em;
    padding-left: 0.12em; /* balances letter-spacing so it centres */
    margin: 48px 0 20px;
  }
  .panel__title {
    font-size: clamp(22px, 2.2vw, 30px);
    font-weight: 400;
    letter-spacing: 0.04em;
    margin-bottom: 40px;
  }
  .panel__desc {
    max-width: 320px;
    margin: 32px auto 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
  }
  .panel__details {
    margin-top: 28px;
    display: grid;
    gap: 14px;
    font-size: 14px;
    line-height: 1.5;
  }
  .panel__details dt { color: var(--muted); }
  .panel__details dd { color: var(--text); }

  .counter {
    position: absolute;
    left: clamp(24px, 5vw, 80px);
    bottom: 28px;
    font-size: 13px;
    color: var(--muted);
    z-index: 5;
    pointer-events: none;
  }

  /* ---------- Mobile: text sits at the bottom ---------- */
  @media (max-width: 760px) {
    :root { --nav-h: 60px; }
    .nav__links { gap: 12px; }
    .nav__links button { font-size: 13px; }
    .nav__logo { font-size: 18px; }
    .panel {
      top: auto;
      bottom: 0;
      transform: none;
      width: 100%;
      padding: 80px 24px 56px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }
    .panel__year { margin: 20px 0 10px; }
    .panel__title { margin-bottom: 20px; }
    .panel__desc { margin-top: 16px; }
    .panel__details { display: none; }
    .rule { width: 140px; }
    .counter { bottom: 20px; left: 24px; }
    .panel__desc { margin-left: auto; margin-right: auto; }
  }

  /* ---------- Pieces display (opens when you click the middle image) ---------- */
  .pieces {
    position: fixed;
    inset: var(--nav-h) 0 0 0;
    z-index: 30;
    background: rgba(255,255,255,.97);
    color: #1b1b1c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px clamp(20px, 5vw, 72px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s ease, visibility .35s;
    overflow-y: auto;
  }
  .pieces.is-open { opacity: 1; visibility: visible; }
  .pieces__head { text-align: center; margin-bottom: 36px; }
  .pieces__eyebrow { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8a8a8a; }
  .pieces__title { font-size: clamp(26px, 3vw, 40px); font-weight: 300; margin-top: 8px; }
  .pieces__grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));   /* 3 images per row */
    gap: 28px;
    width: min(1100px, 100%);
  }
  .piece { text-align: center; opacity: 0; transform: translateY(16px); transition: opacity .45s ease, transform .45s ease; }
  .pieces.is-open .piece { opacity: 1; transform: none; }
  .pieces.is-open .piece:nth-child(2) { transition-delay: .08s; }
  .pieces.is-open .piece:nth-child(3) { transition-delay: .16s; }
  .piece__img {
    aspect-ratio: 1 / 1;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a8a8a;
    font-size: 14px;
    padding: 16px;
    overflow: hidden;
  }
  .piece__img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .piece__name { margin-top: 16px; font-size: 17px; font-weight: 400; }
  .piece__detail { margin-top: 4px; font-size: 14px; color: #8a8a8a; }
  .pieces__close {
    position: absolute;
    top: 20px;
    right: clamp(20px, 4vw, 56px);
    width: 44px;
    height: 44px;
    border: 1px solid #d6d6d6;
    background: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .pieces__close:hover { border-color: #1b1b1c; }
  .pieces__empty { color: #8a8a8a; text-align: center; }

  /* silver / gold circles on the right side of the middle wheel image (shown on hover) */
  .wheel-metals {
    position: fixed;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transform: translate(-50%, -50%) translateX(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .wheel-metals.is-visible { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  body.on-categories .wheel-metals { display: none; }
  @media (hover: none) {                       /* touch screens: always show */
    .wheel-metals { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  }
  .metal {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.15);
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    cursor: pointer;
    padding: 0;
  }
  .metal--silver { background: linear-gradient(135deg, #fafafa 0%, #d4d4d4 45%, #a9a9a9 100%); }
  .metal--gold   { background: linear-gradient(135deg, #f8e3a1 0%, #d9b45a 50%, #b38a2e 100%); }
  .metal:hover, .metal:focus-visible { outline: 1px solid #1b1b1c; outline-offset: 3px; }
  .metal[aria-pressed="true"] { outline: 2px solid #1b1b1c; outline-offset: 3px; }

  /* ---------- Desktop: pieces sit in the white space beside the wheel ---------- */
  body.pieces-side .pieces {
    inset: var(--nav-h) 0 0 auto;      /* left is set by the script */
    background: transparent;
    align-items: stretch;
    padding: 24px 40px 24px 0;
    pointer-events: none;
  }
  body.pieces-side .pieces.is-open { pointer-events: auto; }
  body.pieces-side .pieces__head { text-align: left; margin-bottom: 24px; position: relative; }
  body.pieces-side .pieces__close { position: absolute; top: 0; right: 0; width: 36px; height: 36px; font-size: 18px; }
  body.pieces-side .pieces__grid { grid-template-columns: 1fr; gap: 18px; width: 100%; }
  body.pieces-side .piece {
    display: grid;
    grid-template-columns: var(--thumb, 150px) 1fr;
    align-items: center;
    gap: 20px;
    text-align: left;
    transform: translateX(16px);
  }
  body.pieces-side .pieces.is-open .piece { transform: none; }
  body.pieces-side .piece__img { padding: 10px; }
  body.pieces-side .piece__name { margin-top: 0; font-size: 16px; }

  .panel__hint { margin-top: 22px; font-size: 13px; color: var(--muted); }

  @media (max-width: 760px) {
    .pieces { justify-content: flex-start; padding-top: 80px; }
    .pieces__grid { grid-template-columns: 1fr; max-width: 340px; }
  }

  @media (max-width: 420px) {
    .nav { padding: 0 14px; }
    .nav__links { gap: 9px; }
    .nav__links button { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .panel__inner { transition: none; }
    .pieces, .piece { transition: none; }
  }
</style>
</head>

<nav class="nav">

<main class="stage" id="stage" aria-roledescription="carousel" aria-label="Collection">

<div class="wheel-metals" id="wheelMetals" role="group" aria-label="Metal">

  <button type="button" class="metal metal--gold" data-metal="gold" aria-pressed="false" aria-label="Gold"></button>
</div>

<!-- Pieces the model is wearing -->
<section class="pieces" id="pieces" role="dialog" aria-modal="true" aria-labelledby="piecesTitle" aria-hidden="true">

</section>

/* =========================================================
   CATEGORIES — each detail row is sorted into a type from its name:
   "Earrings", "Ring", "Necklace"/"Pendant", "Bracelet".
   The wheel then shows only the images that include the chosen type.
   ========================================================= */
const TYPES = ["Earrings", "Rings", "Necklaces", "Bracelets"];
function typeOf(label) {
  const t = label.toLowerCase();
  if (/earring/.test(t)) return "Earrings";
  if (/bracelet|bangle/.test(t)) return "Bracelets";
  if (/necklace|pendant|chain/.test(t)) return "Necklaces";
  if (/\bring\b|band/.test(t)) return "Rings";
  return "Other";
}
items.forEach(item => {
  // add  categories: ["Rings", "Bracelets"]  to an item to set its types by hand
  item.types = new Set(item.categories || (item.details || []).map(d => typeOf(d.label)));
});
const MIN_SEGMENTS = 9;   // short lists are repeated so the wheel always looks full

/* =========================================================
   FIRST WHEEL — the 4 category images shown when the page opens.
   Clicking one opens that category's collection (the items above).
   Keep "key" exactly as it is: it links the image to its collection.
   ========================================================= */
const categories = [
  {
    key: "Earrings",
    src: "./images/image4.jpg",              // ← add your EARRINGS image here, e.g. "./images/earrings.jpg"
    alt: "Earrings",
    year: "2026",
    title: "Earrings",
    description: ""       // ← optional short line under the title
  },
  {
    key: "Rings",
    src: "./images/image6.jpg",              // ← add your RINGS image here, e.g. "./images/rings.jpg"
    alt: "Rings",
    year: "2026",
    title: "Rings",
    description: ""
  },
  {
    key: "Necklaces",
    src: "./images/image2.jpg",              // ← add your NECKLACES image here, e.g. "./images/necklaces.jpg"
    alt: "Necklaces",
    year: "2026",
    title: "Necklaces",
    description: ""
  },
  {
    key: "Bracelets",
    src: "./images/image12.png",              // ← add your BRACELETS image here, e.g. "./images/bracelets.jpg"
    alt: "Bracelets",
    year: "2026",
    title: "Bracelets",
    description: ""
  }
];
let loop = true;           // the wheel loops forever
const START_CATEGORY = 1;  // which category sits in the middle when the page opens (0 = Earrings)

/* =========================================================
rolling of the well
   ========================================================= */
const STEP_DEG   = 24;    // angle between each image
const GAP_PX     = 34;    // dark gap between images
const WHEEL_SENS = 1 / 300; // scroll sensitivity (higher = faster)
const DRAG_SENS  = 1 / 260; // drag / swipe sensitivity
const EASE       = 0.12;  // 0–1, how quickly the wheel catches up
const SNAP_DELAY = 140;   // ms after scrolling stops before snapping

/* ========================================================= */
const stage   = document.getElementById("stage");
const panel   = document.getElementById("panel");
const yearEl  = document.getElementById("year");
const titleEl = document.getElementById("title");
const descEl  = document.getElementById("desc");
const detEl   = document.getElementById("details");
const counter = document.getElementById("counter");

let filter = "All";
let list = items;          // the images for the current filter
let wheel = [];            // what's on the wheel: { item, k } (k = position in list)
let N = 0;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let current = 0;   // animated position (float, in items)
let target  = 0;   // where we're heading
let active  = -1;  // index shown in the panel
let geom    = {};
let snapTimer = null;
let lastDir = 0;
let rafId = null;

// Build the wheel for the current filter
let segments = [];
function buildWheel() {
  segments.forEach(el => el.remove());
  wheel = [];
  const isCategory = filter === "All";
  // first wheel = the 4 categories; otherwise the chosen collection
  list = isCategory ? categories : items.filter(it => it.types.has(filter));
  loop = true;                                     // both loop forever
  if (list.length) {
    const reps = Math.max(1, Math.ceil(MIN_SEGMENTS / list.length));
    for (let r = 0; r < reps; r++) list.forEach((item, k) => wheel.push({ item, k, isCategory }));
  }
  N = wheel.length;
  segments = wheel.map(({ item, isCategory }, i) => makeSegment(item, i, isCategory));
}

function makeSegment(item, i, isCategory) {
  const el = document.createElement("div");
  el.className = "segment";
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "-1");
  el.setAttribute("aria-label", item.alt || item.title);

  if (item.src) {
    const img = document.createElement("img");
    img.src = metalSrc(item);
    img.alt = item.alt || "";
    img.draggable = false;
    el.appendChild(img);
  } else {
    const ph = document.createElement("span");
    ph.className = "segment__placeholder";
    ph.textContent = isCategory ? item.title : `Image ${i + 1}`;
    el.appendChild(ph);
  }

  // hovering the middle image shows the silver / gold circles
  if (!isCategory) {
    el.addEventListener("mouseenter", () => { if (i === active) showMetals(); });
    el.addEventListener("mouseleave", hideMetalsSoon);
  }

  // runs when the image is clicked or tapped (see endDrag)
  el._activate = () => {
    if (isCategory) setFilter(item.key);          // open that category's collection
    else if (i === active) openPieces(item);       // middle image: show the pieces she's wearing
    else goTo(current + wrap(i - current));        // other images: bring to the middle
  };

  stage.appendChild(el);
  return el;
}

// Wrap an offset into [-N/2, N/2) so the wheel loops forever
function wrap(d) {
  if (!loop) return d;                            // category row doesn't loop
  return ((d % N) + N + N / 2) % N - N / 2;
}
const mod = (n) => loop ? ((n % N) + N) % N : Math.min(N - 1, Math.max(0, n));
const limit = (t) => loop ? t : Math.min(N - 1, Math.max(0, t));
const soften = (t) => loop ? t : Math.min(N - 0.6, Math.max(-0.4, t));

/* ---------- Geometry ---------- */
function layout() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const mobile = w <= 760;

  // Inner radius (edge of the dark circle), ring thickness, and centre
  const r     = mobile ? h * 0.55 : h * 0.62;
  const ring  = mobile ? Math.min(h * 0.38, w * 0.62) : Math.min(h * 0.42, w * 0.42);
  const R     = r + ring;
  const panelW = mobile ? w * 0.28 : Math.min(Math.max(w * 0.42, 380), 640);
  const cx    = panelW - r;
  const cy    = mobile ? h * 0.38 : h / 2;

  const step  = STEP_DEG * Math.PI / 180;
  const gap   = GAP_PX / ((r + R) / 2);
  const a     = step / 2 - gap / 2;   // half-angle of one image

  const left  = r * Math.cos(a);      // x of the inner corners
  const segW  = R - left;
  const segH  = 2 * R * Math.sin(a);

  // Annular-sector clip path in the segment's own coordinates
  const px = (x) => (x - left).toFixed(2);
  const py = (y) => (y + segH / 2).toFixed(2);
  const oTop = [R * Math.cos(a), -R * Math.sin(a)];
  const oBot = [R * Math.cos(a),  R * Math.sin(a)];
  const iBot = [r * Math.cos(a),  r * Math.sin(a)];
  const iTop = [r * Math.cos(a), -r * Math.sin(a)];
  const path =
    `path("M ${px(oTop[0])} ${py(oTop[1])} ` +
    `A ${R} ${R} 0 0 1 ${px(oBot[0])} ${py(oBot[1])} ` +
    `L ${px(iBot[0])} ${py(iBot[1])} ` +
    `A ${r} ${r} 0 0 0 ${px(iTop[0])} ${py(iTop[1])} Z")`;

  segments.forEach((el) => {
    el.style.left   = `${cx + left}px`;
    el.style.top    = `${cy - segH / 2}px`;
    el.style.width  = `${segW}px`;
    el.style.height = `${segH}px`;
    el.style.transformOrigin = `${-left}px ${segH / 2}px`;
    el.style.clipPath = path;
    el.style.webkitClipPath = path;
  });

  // silver / gold circles: just outside the right edge of the middle image
  const stageTop = stage.getBoundingClientRect().top;
  wheelMetals.style.left = Math.min(cx + R + (mobile ? 22 : 34), w - 18) + "px";
  wheelMetals.style.top = (stageTop + cy) + "px";

  // white space to the right of the wheel, used for the pieces display on desktop
  const sideLeft = cx + R + 80;            // leaves room for the silver / gold circles
  const sideW = w - sideLeft - 32;
  const side = !mobile && sideW >= 300;
  document.body.classList.toggle("pieces-side", side);
  if (side) {
    piecesEl.style.left = sideLeft + "px";
    piecesEl.style.setProperty("--thumb", Math.round(Math.min(170, (h - 190) / 3, sideW * 0.42)) + "px");
  } else {
    piecesEl.style.left = "";
  }
  geom = { cx, cy, r, mobile, side };
  fitPanel();
  render();
}

/* Keep the text inside the black circle.
   The circle gets narrower above and below its centre, so the text
   width is set to the width of the circle at the top/bottom of the text. */
function fitPanel() {
  if (geom.mobile) {
    panel.style.left = panel.style.width = panel.style.top = "";
    return;
  }
  const { cx, cy, r } = geom;
  const margin = 40;                 // space between text and the images
  const left = Math.max(margin, 24);
  let width = cx + r - margin - left;
  for (let k = 0; k < 4; k++) {       // measure → narrow → measure again
    panel.style.left  = `${left}px`;
    panel.style.width = `${Math.max(width, 200)}px`;
    const halfH = panel.offsetHeight / 2;
    const edge = cx + Math.sqrt(Math.max(r * r - halfH * halfH, 0)) - margin;
    width = edge - left;
  }
  panel.style.top = `${cy}px`;
}

/* ---------- Drawing ---------- */
function render() {
  if (!N) return;
  segments.forEach((el, i) => {
    const d = wrap(i - current);
    const deg = d * STEP_DEG;
    if (Math.abs(deg) > 110) {
      el.style.visibility = "hidden";
      return;
    }
    el.style.visibility = "visible";
    el.style.transform = `rotate(${deg}deg)`;
  });

  const idx = mod(Math.round(current));
  if (idx !== active) setActive(idx);
}

function setActive(idx) {
  if (wheel[idx]) syncMetals(wheel[idx].item);
  const first = active === -1;
  active = idx;
  counter.textContent = `${wheel[idx].k + 1} / ${list.length}`;
  segments.forEach((el, i) => el.setAttribute("aria-current", i === idx ? "true" : "false"));

  if (first || reduceMotion) {
    fillPanel(wheel[idx].item);
    return;
  }
  panel.classList.add("is-changing");
  clearTimeout(setActive.t);
  setActive.t = setTimeout(() => {
    fillPanel(wheel[active].item);
    if (piecesOpen && !wheel[active].isCategory) renderPieces(wheel[active].item);
    panel.classList.remove("is-changing");
  }, 220);
}

function fillPanel(item) {
  yearEl.textContent  = item.year || "";
  titleEl.textContent = filter === "All" ? (item.title || "") : filter;
  if (item.key) {                                  // a category on the first wheel
    const n = new Set(items.flatMap(it => it.details || [])
      .filter(d => typeOf(d.label) === item.key).map(d => d.label + "|" + d.value)).size;  // pieces, counted once
    item = { ...item, details: [{ label: `${n} ${n === 1 ? "piece" : "pieces"}`, value: "Click the image to view the collection" }] };
  }
  descEl.textContent  = item.description || "";
  descEl.style.display = item.description ? "" : "none";
  detEl.innerHTML = "";
  (item.details || [])
    .filter(d => filter === "All" || typeOf(d.label) === filter)
    .forEach(({ label, value }) => {
    const row = document.createElement("div");
    row.innerHTML = `<dt></dt><dd></dd>`;
    row.querySelector("dt").textContent = label;
    row.querySelector("dd").textContent = value;
    detEl.appendChild(row);
  });
  if (!item.key) {                                 // in a collection, not on the category wheel
    const hint = document.createElement("p");
    hint.className = "panel__hint";
    hint.textContent = "Click the image to see the pieces";
    detEl.appendChild(hint);
  }
  if (geom.cx !== undefined) fitPanel();
}

/* ---------- Animation loop ---------- */
function tick() {
  const diff = target - current;
  if (Math.abs(diff) < 0.0005) {
    current = target;
    render();
    rafId = null;
    return;
  }
  current += reduceMotion ? diff : diff * EASE;
  render();
  rafId = requestAnimationFrame(tick);
}
function animate() {
  if (!rafId) rafId = requestAnimationFrame(tick);
}
function goTo(t) {
  target = limit(t);
  animate();
}
function scheduleSnap() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    // lean toward the direction of travel so one mouse-wheel notch = one image
    goTo(Math.round(target + 0.3 * lastDir));
  }, SNAP_DELAY);
}

/* ---------- Input: mouse wheel / trackpad ---------- */
window.addEventListener("wheel", (e) => {
  if (piecesOpen && !geom.side) return;             // full-screen version: let it scroll instead
  e.preventDefault();
  const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  const px = e.deltaMode === 1 ? delta * 40 : delta; // line mode → px
  lastDir = Math.sign(px);
  target = soften(target + px * WHEEL_SENS);
  animate();
  scheduleSnap();
}, { passive: false });

/* ---------- Input: drag / swipe ---------- */
let dragging = false, startY = 0, startTarget = 0, wasDrag = false;

stage.addEventListener("pointerdown", (e) => {
  dragging = true;
  wasDrag = false;
  startY = e.clientY;
  startTarget = target;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dy = startY - e.clientY;
  if (Math.abs(dy) > 5) {
    wasDrag = true;
    stage.classList.add("is-dragging");
  }
  lastDir = Math.sign(dy);
  target = soften(startTarget + dy * DRAG_SENS);
  animate();
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  stage.classList.remove("is-dragging");
  if (wasDrag) goTo(Math.round(target + 0.3 * lastDir));
  else if (e && e.type === "pointerup") {
    // a click, not a drag: find the image under the pointer
    const seg = document.elementFromPoint(e.clientX, e.clientY)?.closest(".segment");
    if (seg && seg._activate) seg._activate();
  }
  setTimeout(() => (wasDrag = false), 0);
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* ---------- Input: keyboard ---------- */
window.addEventListener("keydown", (e) => {
  if (piecesOpen && e.key === "Escape") { closePieces(); return; }
  if (piecesOpen && !geom.side) return;
  if (["ArrowDown", "ArrowRight", "PageDown"].includes(e.key)) {
    e.preventDefault();
    goTo(Math.round(target) + 1);
  } else if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) {
    e.preventDefault();
    goTo(Math.round(target) - 1);
  }
});

/* ---------- Silver / gold circles on the wheel ---------- */
const wheelMetals = document.getElementById("wheelMetals");
let metalsTimer = null;

function metalSrc(item) {
  return (item._metal === "gold" && item.srcGold) || (item._metal === "silver" && item.srcSilver) || item.src;
}
function showMetals() {
  clearTimeout(metalsTimer);
  wheelMetals.classList.add("is-visible");
}
function hideMetalsSoon() {
  clearTimeout(metalsTimer);
  metalsTimer = setTimeout(() => wheelMetals.classList.remove("is-visible"), 250);
}
function syncMetals(item) {
  wheelMetals.querySelectorAll(".metal").forEach(b =>
    b.setAttribute("aria-pressed", item && item._metal === b.dataset.metal ? "true" : "false"));
}
wheelMetals.addEventListener("mouseenter", showMetals);
wheelMetals.addEventListener("mouseleave", hideMetalsSoon);
wheelMetals.addEventListener("click", (e) => {
  const btn = e.target.closest(".metal");
  if (!btn || !wheel[active] || wheel[active].isCategory) return;
  const item = wheel[active].item;
  item._metal = item._metal === btn.dataset.metal ? null : btn.dataset.metal;   // click again to clear
  syncMetals(item);
  // swap the model photo on every copy of this image on the wheel
  wheel.forEach((w, i) => {
    if (w.item !== item) return;
    const img = segments[i].querySelector("img");
    if (img) img.src = metalSrc(item);
  });
  if (piecesOpen) renderPieces(item);
  else openPieces(item);                            // show the filtered pieces straight away
});

/* ---------- Pieces display ---------- */
const piecesEl = document.getElementById("pieces");
const piecesGrid = document.getElementById("piecesGrid");
let piecesOpen = false;
let piecesReturnFocus = null;

function openPieces(item) {
  renderPieces(item);
  piecesReturnFocus = document.activeElement;
  piecesOpen = true;
  piecesEl.setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => piecesEl.classList.add("is-open"));
  if (!geom.side) document.getElementById("piecesClose").focus();
}

function renderPieces(item) {
  // only the pieces of the open collection's type (e.g. rings in Rings)
  // ...and, if silver or gold is chosen, only the pieces in that metal
  const metal = item._metal;                         // "silver", "gold" or null
  const list = (item.details || [])
    .filter(d => filter === "All" || typeOf(d.label) === filter)
    .filter(d => !metal || !d.metal || d.metal === metal || d.metal === "both");
  const heading = filter === "All" ? (item.title || "") : filter;
  document.getElementById("piecesTitle").textContent =
    metal ? `${heading} · ${metal === "gold" ? "Gold" : "Silver"}` : heading;
  piecesGrid.innerHTML = "";
  if (!list.length) {
    piecesGrid.innerHTML = metal
      ? `<p class="pieces__empty">No ${metal} pieces in this look.</p>`
      : `<p class="pieces__empty">No pieces listed for this image yet.</p>`;
  }
  list.forEach((piece) => {
    const { label, value, src } = piece;
    const card = document.createElement("article");
    card.className = "piece";
    card.innerHTML = `
      <div class="piece__img"></div>
      <div class="piece__text">
        <h3 class="piece__name"></h3>
        <p class="piece__detail"></p>
      </div>`;
    const box = card.querySelector(".piece__img");
    const showImage = (url) => {
      box.innerHTML = "";
      if (url) {
        const img = document.createElement("img");
        img.src = url; img.alt = label;
        box.appendChild(img);
      } else {
        box.textContent = label;                    // placeholder until src is added
      }
    };
    // follow the silver / gold choice made on the wheel image
    showImage((item._metal === "gold" && piece.srcGold) || (item._metal === "silver" && piece.srcSilver) || src);
    card.querySelector(".piece__name").textContent = label;
    card.querySelector(".piece__detail").textContent = value;
    piecesGrid.appendChild(card);
  });
}

function closePieces() {
  piecesOpen = false;
  piecesEl.classList.remove("is-open");
  piecesEl.setAttribute("aria-hidden", "true");
  if (piecesReturnFocus) piecesReturnFocus.focus();
}
document.getElementById("piecesClose").addEventListener("click", closePieces);
piecesEl.addEventListener("click", (e) => { if (e.target === piecesEl) closePieces(); });

/* ---------- Filters (Earrings / Rings / Necklaces / Bracelets) ---------- */
function setFilter(f) {
  if (piecesOpen) closePieces();
  filter = f;
  document.body.classList.toggle("on-categories", f === "All");
  document.querySelectorAll("[data-filter]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.filter === f ? "true" : "false"));
  buildWheel();
  current = target = f === "All" ? START_CATEGORY : 0;
  active = -1;
  layout();
}
document.getElementById("filters").addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]");
  if (b && b.dataset.filter !== filter) setFilter(b.dataset.filter);
});

window.addEventListener("resize", layout);
document.body.classList.add("on-categories");
buildWheel();
current = target = START_CATEGORY;
layout();
</script>
</body>
</html>
