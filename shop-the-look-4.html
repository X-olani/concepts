<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shimansky | Shop the look</title>
<style>
  :root {
    --ink: #1f1c18;
    --ink-soft: #6b645a;
    --white: #ffffff;
    --tint: #f4f0ea;
    --brass: #9c7a36;
    --line: #e3ddd3;
    --nav-h: 72px;
    --panel-w: min(440px, 100vw);
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  body.panel-open { overflow: hidden; }

  .wrap { width: min(1240px, 100% - 48px); margin: 0 auto; }

  /* ---------- Nav ---------- */
  .nav {
    position: fixed;
    inset: 0 0 auto 0;
    height: var(--nav-h);
    background: var(--white);
    border-bottom: 1px solid var(--line);
    z-index: 50;
  }
  .nav .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; }
  .nav__logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
  }
  .nav__links { display: flex; gap: 32px; list-style: none; }
  .nav__links a { text-decoration: none; font-size: 15px; padding: 6px 0; border-bottom: 1px solid transparent; }
  .nav__links a:hover, .nav__links a[aria-current="page"] { border-bottom-color: var(--ink); }
  .nav__short { display: none; }

  main { padding-top: var(--nav-h); }

  /* ---------- Full-screen hero ---------- */
  .hero {
    position: relative;
    height: calc(100vh - var(--nav-h));
    min-height: 480px;
    overflow: hidden;
    background: var(--tint);
  }
  .hero__media { position: absolute; inset: 0; overflow: hidden; }
  .hero__layer { position: absolute; }
  .hero__layer > img {
    display: block;
    width: 100%;
    height: 100%;
    user-select: none;
  }
  .hero__shade {
    position: absolute;
    inset: auto 0 0 0;
    height: 34%;
    background: linear-gradient(to top, rgba(31,28,24,.6), rgba(31,28,24,0));
    pointer-events: none;
  }
  .hero__text {
    position: absolute;
    left: max(24px, (100% - 1240px) / 2);   /* lines up with the logo */
    bottom: clamp(28px, 5vh, 56px);
    color: var(--white);
    pointer-events: none;
  }
  .hero__text .eyebrow { color: var(--white); opacity: .85; }
  .hero__text h1 { font-size: clamp(34px, 4.5vw, 60px); font-weight: 300; line-height: 1.05; margin-top: 8px; }
  .hero__text p { margin-top: 8px; opacity: .9; font-size: 16px; }
  .eyebrow { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }

  /* each hotspot is a clickable area over the piece, with a dot in the middle */
  .hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    transition: border-color .25s, background .25s;
  }
  .hotspot:hover, .hotspot:focus-visible, .hotspot.is-active {
    border-color: rgba(255,255,255,.9);
    background: rgba(255,255,255,.08);
    outline: none;
  }
  .hotspot__dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .hotspot__dot::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 1.5px solid var(--white);
    animation: ping 2s ease-out infinite;
  }
  @keyframes ping {
    0% { transform: scale(.6); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .hotspot__label {
    position: absolute;
    left: 50%;
    top: calc(50% + 22px);
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 6px 12px;
    background: var(--white);
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .hotspot:hover .hotspot__label, .hotspot:focus-visible .hotspot__label { opacity: 1; }

  .hint { padding: 20px 0 80px; color: var(--ink-soft); font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .hint__dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }

  /* ---------- Side panel ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(31,28,24,.35);
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s, visibility .35s;
    z-index: 60;
  }
  .panel {
    position: fixed;
    top: 0;
    right: 0;
    width: var(--panel-w);
    height: 100%;
    background: var(--white);
    box-shadow: -12px 0 40px rgba(0,0,0,.12);
    transform: translateX(100%);
    transition: transform .45s cubic-bezier(.22,.8,.24,1);
    z-index: 70;
    display: flex;
    flex-direction: column;
    visibility: hidden;
  }
  body.panel-open .overlay { opacity: 1; visibility: visible; }
  body.panel-open .panel { transform: none; visibility: visible; }

  .panel__top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: var(--nav-h);
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .panel__count { font-size: 13px; color: var(--ink-soft); }
  .panel__close {
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    background: var(--white);
    font-size: 20px;
    line-height: 1;
  }
  .panel__close:hover { border-color: var(--ink); }

  .panel__body { overflow-y: auto; padding: 28px; flex: 1; }
  .panel__img {
    aspect-ratio: 1 / 1;
    background-color: var(--tint);
    background-repeat: no-repeat;
    overflow: hidden;
  }
  .panel__img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .panel__body h2 { font-size: 28px; font-weight: 300; line-height: 1.2; margin-top: 8px; }
  .panel__body .eyebrow { margin-top: 24px; }
  .panel__price { font-size: 17px; margin-top: 10px; }
  .panel__desc { color: var(--ink-soft); margin-top: 16px; }

  .specs { margin-top: 24px; border-top: 1px solid var(--line); }
  .specs div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .specs dt { color: var(--ink-soft); }
  .specs dd { text-align: right; }

  .panel__actions { display: grid; gap: 10px; margin-top: 28px; }
  .btn {
    display: block;
    padding: 14px 20px;
    text-align: center;
    text-decoration: none;
    border: 1px solid var(--ink);
    font-size: 15px;
    transition: background .2s, color .2s;
  }
  .btn--solid { background: var(--ink); color: var(--white); }
  .btn--solid:hover { background: var(--white); color: var(--ink); }
  .btn--line { background: var(--white); }
  .btn--line:hover { background: var(--ink); color: var(--white); }

  .panel__nav {
    display: flex;
    border-top: 1px solid var(--line);
    flex: none;
  }
  .panel__nav button {
    flex: 1;
    padding: 18px;
    border: 0;
    background: var(--white);
    font-size: 14px;
  }
  .panel__nav button + button { border-left: 1px solid var(--line); }
  .panel__nav button:hover { background: var(--tint); }

  /* ---------- Setup mode (add ?setup to the URL) ---------- */
  .setup-badge {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 12px 18px;
    background: var(--ink);
    color: var(--white);
    font-size: 14px;
    z-index: 80;
  }
  .setup .hotspot { border-color: rgba(255,0,0,.8); }

  footer { background: var(--ink); color: #cfc7ba; padding: 40px 0; font-size: 14px; }

  @media (max-width: 640px) {
    :root { --nav-h: 60px; }
    .nav__links { gap: 14px; }
    .nav__links a { font-size: 14px; }
    .nav__logo { font-size: 16px; letter-spacing: .12em; }
    .nav__full { display: none; }
    .nav__short { display: inline; }
    .hotspot__dot { width: 14px; height: 14px; margin: -7px 0 0 -7px; }
    .hotspot__label { display: none; }
    .panel__body { padding: 22px; }
    /* phones: image on top (sized so all three pieces fit), text underneath */
    .hero { height: auto; min-height: calc(100svh - var(--nav-h)); display: flex; flex-direction: column; background: var(--white); }
    .hero__media { position: relative; height: 55vh; min-height: 380px; flex: none; }
    .hero__shade { display: none; }
    .hero__text { position: static; color: var(--ink); padding: 28px 24px 40px; }
    .hero__text .eyebrow { color: var(--brass); opacity: 1; }
    .hero__text p { color: var(--ink-soft); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hotspot__dot::after { animation: none; }
    .panel, .overlay { transition: none; }
  }
</style>
</head>

/* ========================================================= */
const stage = document.getElementById("stage");
const layer = document.getElementById("layer");

/* Which part of the photo to keep in view when the screen crops it (in %).
   These keep the tray in view. */
const FOCUS_X = 54;
const FOCUS_Y = 60;
const IMG_W = 1357, IMG_H = 1159;   // the photo's size in pixels
const stageImg = document.getElementById("stageImg");
const panel = document.getElementById("panel");
const overlay = document.getElementById("overlay");
const $ = (id) => document.getElementById(id);

let current = -1;
let lastFocus = null;
const hotspots = [];

// Build hotspots
items.forEach((item, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "hotspot";
  b.style.left = item.x + "%";
  b.style.top = item.y + "%";
  b.style.width = item.w + "%";
  b.style.height = item.h + "%";
  b.setAttribute("aria-label", `${item.name}, view details`);
  b.innerHTML = `<span class="hotspot__dot"></span><span class="hotspot__label">${item.name}</span>`;
  b.addEventListener("click", (e) => {
    if (setupMode) return;
    e.stopPropagation();
    openPanel(i);
  });
  layer.appendChild(b);
  hotspots.push(b);
});

// Fill the screen like background-size: cover, keeping the focus point in view
function layoutHero() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const scale = Math.max(W / IMG_W, H / IMG_H);
  const w = IMG_W * scale, h = IMG_H * scale;
  const left = Math.min(0, Math.max(W - w, W / 2 - w * FOCUS_X / 100));
  const top  = Math.min(0, Math.max(H - h, H / 2 - h * FOCUS_Y / 100));
  Object.assign(layer.style, { width: w + "px", height: h + "px", left: left + "px", top: top + "px" });
}
layoutHero();

function fillPanel(i) {
  const item = items[i];
  $("panelCount").textContent = `${i + 1} of ${items.length}`;
  $("panelType").textContent = item.type;
  $("panelTitle").textContent = item.name;
  $("panelPrice").textContent = item.price;
  $("panelPrice").hidden = !item.price;
  $("panelDesc").textContent = item.description;

  const specs = $("panelSpecs");
  specs.innerHTML = "";
  (item.specs || []).forEach(({ label, value }) => {
    const row = document.createElement("div");
    row.innerHTML = "<dt></dt><dd></dd>";
    row.children[0].textContent = label;
    row.children[1].textContent = value;
    specs.appendChild(row);
  });

  // Product photo, or a close-up cropped from the main image
  const img = $("panelImg");
  img.innerHTML = "";
  if (item.src) {
    img.style.backgroundImage = "";
    const el = document.createElement("img");
    el.src = item.src;
    el.alt = item.name;
    img.appendChild(el);
  } else {
    const ratio = IMG_W / IMG_H;                              // image width / height
    const box = Math.max(item.w, item.h / ratio) * 1.3;    // square crop around the piece, in % of image width
    const bw = 100 / box * 100;                            // background width, in % of the panel box
    img.style.backgroundImage = `url("${stageImg.src}")`;
    img.dataset.crop = JSON.stringify({ bw, bh: bw / ratio, x: item.x, y: item.y });
    positionCrop(img);
  }

  $("panelEnquire").href = `mailto:?subject=${encodeURIComponent("Enquiry: " + item.name)}`;
  hotspots.forEach((h, k) => h.classList.toggle("is-active", k === i));
}

// Position the close-up precisely in pixels (re-run on resize)
function positionCrop(el) {
  if (!el.dataset.crop || !el.style.backgroundImage) return;
  const { bw, bh, x, y } = JSON.parse(el.dataset.crop);
  const size = el.clientWidth;                   // the box is square
  const bgW = size * bw / 100, bgH = size * bh / 100;
  const left = size / 2 - bgW * x / 100;
  const top = size / 2 - bgH * y / 100;
  el.style.backgroundSize = `${bgW}px ${bgH}px`;
  el.style.backgroundPosition = `${left}px ${top}px`;
}

function openPanel(i) {
  if (current === -1) lastFocus = document.activeElement;
  current = i;
  fillPanel(i);
  document.body.classList.add("panel-open");
  panel.setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => positionCrop($("panelImg")));
  setTimeout(() => $("panelClose").focus(), 50);
}

function closePanel() {
  document.body.classList.remove("panel-open");
  panel.setAttribute("aria-hidden", "true");
  hotspots.forEach(h => h.classList.remove("is-active"));
  current = -1;
  if (lastFocus) lastFocus.focus();
}

$("panelClose").addEventListener("click", closePanel);
overlay.addEventListener("click", closePanel);
$("panelPrev").addEventListener("click", () => openPanel((current - 1 + items.length) % items.length));
$("panelNext").addEventListener("click", () => openPanel((current + 1) % items.length));

document.addEventListener("keydown", (e) => {
  if (current === -1) return;
  if (e.key === "Escape") closePanel();
  if (e.key === "ArrowRight") openPanel((current + 1) % items.length);
  if (e.key === "ArrowLeft") openPanel((current - 1 + items.length) % items.length);
  if (e.key === "Tab") {                           // keep focus inside the panel
    const f = panel.querySelectorAll("button, a[href]");
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

window.addEventListener("resize", () => { layoutHero(); positionCrop($("panelImg")); });

/* ---------- Setup mode: open the page with ?setup ---------- */
const setupMode = new URLSearchParams(location.search).has("setup");
if (setupMode) {
  document.body.classList.add("setup");
  const badge = document.createElement("div");
  badge.className = "setup-badge";
  badge.textContent = "Setup mode: click the image to get x and y";
  document.body.appendChild(badge);
  layer.addEventListener("click", (e) => {
    const r = layer.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width * 100).toFixed(1);
    const y = ((e.clientY - r.top) / r.height * 100).toFixed(1);
    badge.textContent = `x: ${x}, y: ${y}`;
    console.log(`x: ${x}, y: ${y}`);
  });
}
</script>
